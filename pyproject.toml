[build-system]
requires = ["setuptools>=62.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mapaccuracy"
version = "0.1.2"
description = "Unbiased Thematic Map Accuracy and Area"
readme = "README.md"
authors = [
    { name = "Timothée Stassin" }
]
requires-python = ">=3.10.12"
dependencies = [
    "numpy>=1.19.0",
    "pandas>=1.0.0",
    "scipy>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.10.0",
]

[project.urls]
